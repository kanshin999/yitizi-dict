<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>字的分身 · 异体字谱</title>
<meta name="description" content="输入一个汉字，看它历代的异体写法。数据源自《異體字字典》異體字表、《说文解字》重文与 Unicode Unihan。">
<style>
@font-face{font-family:"SealFallback";src:local("Kaiti SC"),local("KaiTi"),local("STKaiti")}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf7f0;--card:#fffdf8;--ink:#241f1a;--red:#a8322a;--line:#e7ddcc;
  --box:#f6f1e7;--mut:#97876f;--dim:#c9bda8;--noise:.05;--shadow:rgba(90,70,40,.08);
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Noto Serif CJK","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);transition:background .45s,color .45s;
  font-family:var(--serif);line-height:1.85;padding:58px 20px 80px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--noise);z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{max-width:740px;margin:0 auto;position:relative;z-index:1}

/* 页头 */
header{text-align:center;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:6px}
h1{font-size:31px;font-weight:500;letter-spacing:11px;text-indent:11px}
header .sub{margin-top:12px;font-size:12.5px;color:var(--mut);letter-spacing:2.6px}
header .stat{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.5px}

/* 搜索 */
.search{display:flex;justify-content:center;margin:30px 0 16px}
#q{font-family:inherit;font-size:26px;text-align:center;letter-spacing:7px;width:230px;
  padding:8px 4px 10px;border:none;border-bottom:1.5px solid var(--line);background:transparent;
  color:var(--ink);outline:none;transition:border-color .3s,width .3s}
#q:focus{border-color:var(--red)}
#q::placeholder{color:var(--dim);letter-spacing:4px;font-size:19px}

/* 快捷字 */
.quick{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin:8px 0 0}
.quick button{font-family:var(--serif);font-size:15.5px;padding:2px 8px;border:none;background:transparent;
  color:var(--mut);cursor:pointer;transition:color .2s,transform .2s}
.quick button:hover{color:var(--red);transform:translateY(-2px)}

/* 工具条 */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:10px}
.tsep{height:1px;background:var(--line);max-width:440px;margin:16px auto}
.tb-view{margin-bottom:20px}
.toolbar button{font-family:inherit;font-size:12.5px;padding:5px 13px;border:1px solid var(--line);
  border-radius:2px;background:transparent;color:var(--mut);cursor:pointer;letter-spacing:1px;transition:.25s}
.toolbar button:hover{border-color:var(--red);color:var(--red)}
.themes{display:inline-flex;gap:1px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.themes button{border:none;border-radius:0;padding:5px 12px;font-size:12px}
.themes button.on{background:var(--red);color:#fff;border-color:var(--red)}
.themes button.on:hover{background:var(--red);color:#fff}
.parts{max-width:760px;margin:0 auto 22px;background:var(--card);border:1px solid var(--line);
  border-radius:3px;padding:18px;box-shadow:0 10px 26px var(--shadow)}
.parts[hidden]{display:none}
.picked{display:flex;flex-wrap:wrap;gap:7px;align-items:center;min-height:38px;padding:6px 10px;
  background:var(--box);border:1px solid var(--line);border-radius:2px}
.pempty{font-size:11.5px;color:var(--dim);letter-spacing:1px}
.pk-chip{display:inline-flex;align-items:center;gap:4px;font-size:20px;line-height:1;
  padding:4px 8px;background:var(--card);border:1px solid var(--red);border-radius:2px;color:var(--red);cursor:pointer}
.pk-chip i{font-style:normal;font-size:11px;opacity:.6}
.prow{display:flex;gap:8px;justify-content:center;margin-top:12px}
#pin{flex:0 1 220px;font-family:inherit;font-size:16px;letter-spacing:2px;text-align:center;
  padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);outline:none}
#pin:focus{border-color:var(--red)}
#pin::placeholder{font-size:11.5px;letter-spacing:.5px;color:var(--dim)}
#pclear{font-family:inherit;font-size:12px;padding:6px 14px;border:1px solid var(--line);background:transparent;
  color:var(--mut);border-radius:2px;cursor:pointer}
#pclear:hover{border-color:var(--red);color:var(--red)}
.decomp{margin-top:12px;padding:9px 12px;background:var(--box);border:1px solid var(--line);
 border-radius:2px;font-size:12.5px;color:var(--mut);letter-spacing:.5px;line-height:1.9}
.decomp[hidden]{display:none}
.decomp .dz{font-size:17px;color:var(--ink);margin:0 3px}
.decomp .dop{color:var(--red);font-size:15px;margin:0 2px}
.decomp .dc{display:inline-block;font-size:18px;padding:2px 9px;margin:2px 4px 2px 0;
 background:var(--card);border:1px solid var(--line);border-radius:2px;cursor:pointer;color:var(--ink)}
.decomp .dc:hover{border-color:var(--red);color:var(--red)}
.decomp .dlb{font-size:10.5px;color:var(--dim);letter-spacing:1.5px;margin-right:8px}
.psec{display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;color:var(--dim);letter-spacing:2px;margin:16px 0 7px}
#padToggle{font-family:inherit;font-size:10.5px;letter-spacing:.5px;padding:3px 9px;
  border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:2px;cursor:pointer}
#padToggle:hover{border-color:var(--red);color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.pb{font-family:inherit;font-size:17px;line-height:1;padding:7px 0;border:1px solid var(--line);
  border-radius:2px;background:var(--box);color:var(--ink);cursor:pointer;transition:.15s}
.pb:hover{border-color:var(--red);color:var(--red)}
.pb.on{background:var(--red);border-color:var(--red);color:#fff}
.recog{max-width:760px;margin:0 auto 22px;background:var(--card);border:1px solid var(--line);
  border-radius:3px;padding:18px;box-shadow:0 10px 26px var(--shadow)}
.recog[hidden]{display:none}
.drop{border:1px dashed var(--line);border-radius:2px;padding:30px 16px;text-align:center;cursor:pointer;
  transition:.2s;background:var(--box)}
.drop:hover,.drop.over{border-color:var(--red);background:var(--card)}
.dtxt{font-size:14px;color:var(--ink);letter-spacing:1px}
.dsub{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.5px}
.origwrap{text-align:center;margin:14px 0 0}
.origwrap canvas{max-width:100%;border:1px solid var(--line);border-radius:2px;background:#fff;
 image-rendering:auto;box-shadow:0 4px 12px rgba(90,70,40,.08)}
.raction{display:flex;gap:12px;align-items:center;justify-content:center;margin:14px 0 0}
.raction button{font-family:inherit;font-size:13px;padding:7px 22px;border:1px solid var(--red);
 background:var(--red);color:#fff;border-radius:2px;cursor:pointer;letter-spacing:2px;transition:.2s}
.raction button:hover{opacity:.88}
.raction button:disabled{background:var(--dim);border-color:var(--dim);cursor:default;opacity:.7}
.fname{font-size:11px;color:var(--dim);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvwrap{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:14px 0 0}
.pvwrap canvas{border:1px solid var(--line);border-radius:2px;background:#fff}
#binview{width:80px;height:88px;image-rendering:pixelated}
.rstat{text-align:center;font-size:11.5px;color:var(--mut);margin-top:12px;min-height:16px;letter-spacing:.5px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:12px}
.rg{background:var(--box);border:1px solid var(--line);border-radius:2px;padding:6px 3px 4px;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:.2s}
.rg:hover{border-color:var(--red);transform:translateY(-2px)}
.rg img{width:36px;height:36px;display:block}
.rg .rc{font-size:15px;line-height:1.3;color:var(--ink)}
.rg .rs{font-size:9px;color:var(--dim);font-family:var(--sans)}
.rg .rp{font-size:9px;color:var(--red);font-family:var(--sans)}
.pgroup{grid-column:1/-1;font-size:10.5px;color:var(--dim);letter-spacing:2px;margin:6px 0 -2px;
 border-bottom:1px solid var(--line);padding-bottom:4px}
.pgroup.part-h{color:#b8860b;margin-top:12px}
.rg.loose{opacity:.62}
.rg.loose:hover{opacity:1}
.rg .pk{font-size:9px;color:var(--mut);font-family:var(--sans);letter-spacing:0}
.rg .pk.part{color:#b8860b}
.hint{text-align:center;font-size:11.5px;color:var(--dim);letter-spacing:.7px;margin:-14px 0 22px;min-height:18px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 12px 34px var(--shadow);padding:30px 30px 26px;transition:background .45s,border-color .45s}

/* 正字头 */
.head{display:flex;align-items:flex-start;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.zi{font-size:106px;line-height:.92;font-weight:400;letter-spacing:0;min-width:118px;text-align:center;
  color:var(--ink);font-feature-settings:"palt"}
.head .meta{flex:1;padding-top:6px;min-width:0}
.row{display:flex;gap:12px;font-size:13.5px;padding:3px 0;color:var(--ink)}
.row label{color:var(--dim);font-size:12px;letter-spacing:1.6px;min-width:42px;flex-shrink:0;padding-top:1px}
.row span{color:var(--mut)}
.row b{font-weight:400;color:var(--ink)}
.badge{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--red);letter-spacing:2px;
  border:1px solid var(--red);border-radius:2px;padding:1px 9px;opacity:.9}

/* 说文 */
.shuowen{margin:18px 0 4px;padding:14px 16px;background:var(--box);border-left:2px solid var(--red);
  font-size:13.5px;line-height:2;color:var(--ink);letter-spacing:.3px}
.shuowen.kx{border-left-color:var(--mut)}
.shuowen .txt.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
 overflow:hidden;text-overflow:ellipsis}
.shuowen .more{display:block;margin-top:6px;font-family:inherit;font-size:11px;letter-spacing:1.5px;
 color:var(--red);background:transparent;border:none;cursor:pointer;padding:0;opacity:.85}
.shuowen .more:hover{opacity:1;text-decoration:underline}
.shuowen .lb{display:block;font-size:10.5px;color:var(--dim);letter-spacing:2.4px;margin-bottom:5px}
.shuowen .zw{font-size:12.5px;color:var(--mut);margin-top:7px;letter-spacing:1.5px}
.shuowen .zw span{font-size:19px;color:var(--red);margin-left:4px;cursor:pointer;letter-spacing:0}
.shuowen .zw span:hover{text-decoration:underline}
.shuowen .zw .zwlb{font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.5px;margin:0 6px 0 4px}
.shuowen .zw img.zwi{height:19px;width:auto;vertical-align:-3px;margin:0 3px;cursor:pointer}
.shuowen .zw i.zwna{font-style:normal;color:var(--dim);font-size:13px;margin:0 3px;border-bottom:1px dotted var(--dim)}

/* 分区标题 */
.sect{display:flex;align-items:baseline;gap:10px;margin:26px 0 14px}
.sect h3{font-size:13px;font-weight:500;letter-spacing:3.5px;color:var(--ink)}
.sect .n{font-size:11px;color:var(--dim);letter-spacing:1px}
.sect .ln{flex:1;height:1px;background:var(--line)}
.fbar{display:flex;justify-content:center;margin:-6px 0 16px}
.fbar .fb{font-family:inherit;font-size:11.5px;padding:3px 13px;border:1px solid var(--line);
 background:transparent;color:var(--mut);cursor:pointer;letter-spacing:1.5px;margin:0 -1px 0 0}
.fbar .fb:first-child{border-radius:2px 0 0 2px}
.fbar .fb:last-child{border-radius:0 2px 2px 0}
.fbar .fb.on{background:var(--red);border-color:var(--red);color:#fff;position:relative;z-index:1}
.fbar .fb:hover{color:var(--red)}
.fbar .fb.on:hover{color:#fff}

/* 异体网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.vg{position:relative;aspect-ratio:1/1.13;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--box);border:1px solid var(--line);border-radius:2px;
  cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;padding:4px;overflow:hidden}
.vg:hover{border-color:var(--red);transform:translateY(-3px);box-shadow:0 8px 16px var(--shadow)}
.vg .g{font-size:33px;line-height:1.15;color:var(--ink)}
.vg .gl{font-size:9px;color:var(--dim);letter-spacing:.2px;margin-top:2px;margin-bottom:9px;font-family:var(--sans)}
.vg .tag{position:absolute;top:3px;right:4px;font-size:9px;color:var(--red);opacity:.85;line-height:1}
.vg .rad{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;color:var(--dim);
  letter-spacing:.2px;font-family:var(--sans)}
.vg.rel-v{background:transparent;border-style:dashed}
.grid.f-kai .g{font-family:"Kaiti SC","KaiTi","STKaiti","Kaiti TC","Noto Serif CJK SC",serif}
.grid.f-hei .g{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.zi.f-kai{font-family:"Kaiti SC","KaiTi","STKaiti","Kaiti TC","Noto Serif CJK SC",serif}
.zi.f-hei{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.zi.f-kai{font-size:112px}
.zi.f-hei{font-size:100px}
.grid.f-xing .g{font-family:"STXingkai","华文行楷","Xingkai SC","Hannotate SC","HanziPen SC","Kaiti SC",cursive}
.zi.f-xing{font-family:"STXingkai","华文行楷","Xingkai SC","Hannotate SC","HanziPen SC","Kaiti SC",cursive;
 font-size:110px}
.vg.has-z::after{content:"";position:absolute;top:4px;left:4px;width:3px;height:3px;border-radius:50%;background:var(--red);opacity:.5}

/* 未收字 */
.lost{margin-top:14px}
.lost summary{font-size:11.5px;color:var(--mut);letter-spacing:1.2px;cursor:pointer;list-style:none;
  padding:5px 0;border-bottom:1px dashed var(--line)}
.lost summary::-webkit-details-marker{display:none}
.lost summary::before{content:"▸ ";color:var(--dim)}
.lost[open] summary::before{content:"▾ "}
.lost .body{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.lost i{display:block;font-style:normal;font-size:9px;color:var(--dim);text-align:center;padding:7px 2px;
  background:var(--box);border:1px dashed var(--line);border-radius:2px;font-family:var(--sans);line-height:1.4}

/* 关联 */
.rel{margin-top:8px}
.chip{display:inline-block;margin:3px 5px 3px 0;padding:2px 10px;border:1px solid var(--line);border-radius:2px;
  font-size:13px;color:var(--mut);cursor:pointer;transition:.2s;background:transparent;font-family:var(--serif)}
.chip:hover{border-color:var(--red);color:var(--red)}

/* 空态 */
.empty{text-align:center;padding:46px 10px;color:var(--dim);font-size:13px;letter-spacing:1.5px;line-height:2.2}

/* 碑文模式 */
.glyphs{display:flex;flex-wrap:wrap;gap:7px}
.gl-item{width:58px;text-align:center;cursor:pointer;padding:7px 2px 5px;border:1px solid var(--line);
  border-radius:2px;background:var(--box);transition:.2s}
.gl-item:hover{border-color:var(--red);transform:translateY(-2px)}
.gl-item .c{font-size:25px;line-height:1.2;display:block}
.gl-item .n{font-size:9px;color:var(--dim);display:block;margin-top:2px;font-family:var(--sans)}
.gl-item.has .n{color:var(--red)}

footer{margin-top:34px;text-align:center;font-size:10.5px;color:var(--dim);line-height:2;letter-spacing:.3px}
footer a{color:var(--mut);text-decoration:none;border-bottom:1px dotted var(--line)}

@media(max-width:600px){
  body{padding:40px 15px 60px}
  .parts{padding:12px}
  .pad{grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:3px}
  .pb{font-size:15px;padding:6px 0}
  h1{font-size:25px;letter-spacing:8px}
  .card{padding:22px 18px 20px}
  .head{gap:16px}
  .zi{font-size:78px;min-width:88px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
  .vg .g{font-size:26px}
  .vg .gl{display:none}
  .vg .rad{display:none}
  #q{width:190px;font-size:23px}
}
</style>
</head>

<div class="wrap">
  <header>
    <h1>字的分身</h1>
    <div class="sub">历代异体 · 简繁 · 《说文》重文</div>
    <div class="stat">20,125 正字 · 78,016 条异体关系 · 27,983 个可显示字形</div>

    <div class="picked" id="picked"><span class="pempty">点下方部件开始组合 · 可多选</span></div>

  </div></div></main>

  <footer>
    数据来源：《異體字字典》〈異體字表〉（2024・正式七版，76,191 字）<br>

(function(){
  "use strict";
  var _jc = document.getElementById('jscheck');
  if (_jc) _jc.parentNode.removeChild(_jc);
  function boot(DATA){
  DATA.IDS = { s: DATA.idsS, i: DATA.idsI };

  var THEMES = {
    paper:{bg:'#faf7f0',card:'#fffdf8',ink:'#241f1a',red:'#a8322a',line:'#e7ddcc',box:'#f6f1e7',mut:'#97876f',dim:'#c9bda8',noise:'.05',shadow:'rgba(90,70,40,.08)'},
    rubbing:{bg:'#1a1a18',card:'#222220',ink:'#e8e3d8',red:'#c9a227',line:'#37372f',box:'#2a2a26',mut:'#8b8678',dim:'#5f5a4d',noise:'.09',shadow:'rgba(0,0,0,.4)'}
  };
  var MODE = 'paper';
  var $ = function(s){return document.querySelector(s)};
  var card = $('#card'), input = $('#q'), hint = $('#hint');
  var path = [];   // 查阅路径

  /* ---------- 字形可用性检测 ---------- */
  var _cv = document.createElement('canvas'); _cv.width = _cv.height = 48;
  var _cx = _cv.getContext('2d', {willReadFrequently:true});
  var FONT = getComputedStyle(document.body).fontFamily;
  if (!FONT || FONT.indexOf('px') >= 0) FONT = '"Songti SC",serif';
  function bitmap(ch){
    _cx.clearRect(0,0,48,48);
    _cx.font = '36px ' + FONT;
    _cx.textBaseline = 'top'; _cx.fillStyle = '#000';
    _cx.fillText(ch, 0, 0);
    var d = _cx.getImageData(0,0,48,48).data, s = 0;
    for (var i=3;i<d.length;i+=4) s = s*31 + d[i];
    return s;
  }
  var ND = bitmap('\uFFFF'), TEST = bitmap('一'), DETECT = (ND !== TEST);
  function drawable(ch){
    var o = ch.codePointAt(0);
    if (o >= 0xE000 && o <= 0xF8FF) return false;
    if (o >= 0xF0000) return false;
    if (!DETECT) return true;
    return bitmap(ch) !== ND;
  }

  /* ---------- 字形包（1-bit 位图）---------- */
  var GB = null, GN = 0, GWH = 8, GOFF = 8, GDATA = 8, gcache = {};
  function hex2rgb(h){
    h = (h || '#241f1a').replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function initGlyphPack(tries){
    tries = tries || 0;
    if (!window.DecompressionStream) return;
    if (!window.YTZ_GLYPHS){
      if (tries < 100) setTimeout(function(){ initGlyphPack(tries + 1); }, 200);
      return;
    }
    var s = atob(window.YTZ_GLYPHS), u = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
    var ds = new DecompressionStream('gzip');
    new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer().then(function(buf){
      GB = new Uint8Array(buf);
      var dv = new DataView(buf);
      GN = dv.getUint32(4, true);
      GWH = 8; GOFF = 8 + GN*2; GDATA = GOFF + GN*4;
      gcache = {};
      if (path.length) render(path[path.length-1]);
    }).catch(function(){ GB = null; });
  }
  function glyphURL(idx){
    var ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#241f1a';
    var key = idx + '|' + ink;
    if (gcache[key]) return gcache[key];
    var dv = new DataView(GB.buffer);
    var w = GB[GWH+idx*2], h = GB[GWH+idx*2+1];
    if (!w || !h) return '';
    var off = dv.getUint32(GOFF+idx*4, true), pitch = (w+7)>>3;
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var cx = cv.getContext('2d'), im = cx.createImageData(w, h), rgb = hex2rgb(ink);
    for (var y=0;y<h;y++){
      for (var x=0;x<w;x++){
        if (GB[GDATA+off+y*pitch+(x>>3)] & (0x80>>(x&7))){
          var p = (y*w+x)*4;
          im.data[p]=rgb[0]; im.data[p+1]=rgb[1]; im.data[p+2]=rgb[2]; im.data[p+3]=255;
        }
      }
    }
    cx.putImageData(im, 0, 0);
    var url = cv.toDataURL('image/png');
    gcache[key] = url;
    return url;
  }

  /* ---------- 查询归一 ---------- */
  function candidates(ch){
    var out = [ch];
    if (S2T[ch]) S2T[ch].split('').forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
    if (T2S[ch]) T2S[ch].split('').forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
    return out;
  }
  function moeCount(d){
    var n = 0, vs = d.v || [];
    for (var i=0;i<vs.length;i++) if (/^[ABCN]\d/.test(vs[i][1] || '')) n++;
    return n;
  }
  function resolve(ch){
    var cs = candidates(ch), best = null, score = -1;
    for (var i=0;i<cs.length;i++){
      var d = CH[cs[i]];
      if (!d) continue;
      var sc = moeCount(d) * 100 + (d.v || []).length;
      if (sc > score){ score = sc; best = cs[i]; }
    }
    return best;
  }

  /* ---------- 渲染 ---------- */
  function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function trail(){
    if (path.length < 2) return '';
    var cur = path[path.length-1], prev = [];
    for (var i = path.length - 2; i >= 0 && prev.length < 10; i--){
      var c = path[i];
      if (c !== cur && prev.indexOf(c) < 0) prev.push(c);
    }
    if (!prev.length) return '';
    return '<div class="sect" style="margin-top:26px"><h3>历 史 查 询</h3>'
      + '<span class="n">'+prev.length+' 字</span><span class="ln"></span></div>'
      + '<div class="rel">' + prev.map(function(x){
          return '<button class="chip" data-ch="'+esc(x)+'">'+esc(x)+'</button>';
        }).join('') + '</div>';
  }

  var fntMode = '';
  function glyphCell(ch, code, rad, kind, idx){
    if ((!ch || !drawable(ch)) ){
      if (GB && idx != null && idx >= 0){
        var u = glyphURL(idx);
        if (u) return '<div class="vg bit" data-idx="'+idx+'" title="'+esc(code||'')+'　字形图">'
          + '<img src="'+u+'" alt="" style="width:34px;height:auto;image-rendering:auto">'
          + '<span class="gl">'+esc(code && code.length>3 ? '' : (code||''))+'</span></div>';
      }
      return null;
    }
    var tag = '', src = '漢', note = '';
    if (code === 'UH'){ src = '漢'; note = 'Unihan 异体关系'; }
    else if (code === 'SW'){ src = '文'; note = '《说文》重文'; }
    else {
      src = code;
      note = '《異體字字典》' + code;
      if (kind & 1) { tag = '<i class="tag">◎</i>'; note += '　或体'; }
      if (kind & 2) { tag = '<i class="tag">↗</i>'; note += '　另兼正字'; }
    }
    var rc = rad ? rad.split('-') : [];
    var radTxt = rc.length === 3 ? rc[0] + '·' + rc[2] + '画' : '';
    var hasZ = CH[ch] && CH[ch].v && CH[ch].v.length ? ' has-z' : '';
    return '<div class="vg'+hasZ+'" data-ch="'+esc(ch)+'" title="'+esc(note)+'">'
      + tag + '<span class="g">'+esc(ch)+'</span>'
      + '<span class="gl">'+esc(src)+'</span>'
      + '<span class="rad">'+esc(radTxt)+'</span></div>';
  }

  function render(ch){
    var k = resolve(ch);
    if (!k){
      var owner = (BELONG[ch] || '').split('').filter(function(x){ return CH[x] });
      if (owner.length){
        card.innerHTML = '<div class="card">'
          + '<div class="head"><div class="zi">'+esc(ch)+'</div><div class="meta">'
          + '<div class="row"><label>性　质</label><span>异体字形，本身非正字</span></div>'
          + '<div class="row"><label>所　属</label><span>'+owner.map(function(x){return '「'+esc(x)+'」'}).join('')+' 的异体</span></div>'
          + '<span class="badge">'+owner.length+' 个正字共用</span></div></div>'
          + '<div class="sect"><h3>回到正字</h3><span class="ln"></span></div>'
          + '<div class="rel">'+owner.map(function(x){return '<button class="chip" data-ch="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>'
          + '</div>';
        hint.textContent = '它是别人的分身，点正字看全貌';
        return true;
      }
      card.innerHTML = '<div class="card"><div class="empty">「'+esc(ch)+'」<br>未收入异体字表<br><span style="font-size:11.5px">《異體字字典》以台湾标准字体为正字，可换个写法试试</span></div></div>';
      hint.textContent = '';
      return false;
    }
    var d = CH[k] || {};
    var vs = (d.v || []).slice();
    var drawn = [], lost = [];
    var relTr = (d.tr && d.tr !== k) ? d.tr : '', relSr = (d.sr && d.sr !== k) ? d.sr : '';
    var relN = 0;
    if (relSr && relSr.length === 1 && drawable(relSr))
      drawn.push('<div class="vg rel-v" data-ch="'+esc(relSr)+'" title="繁体写法"><span class="g">'+esc(relSr)+'</span><span class="gl">繁</span></div>'), relN++;
    if (relTr && relTr.length === 1 && drawable(relTr))
      drawn.push('<div class="vg rel-v" data-ch="'+esc(relTr)+'" title="简体写法"><span class="g">'+esc(relTr)+'</span><span class="gl">简</span></div>'), relN++;
    vs.forEach(function(e){
      var g = glyphCell(e[0], e[1], e[2], e[3], e[4]);
      if (g) drawn.push(g); else lost.push(e);
    });

    var rows = '';
    var tr = d.tr || S2T[k] || '';
    var sr = d.sr || T2S[k] || '';
    if (k !== ch) rows += '<div class="row"><label>查　字</label><span>「'+esc(ch)+'」→ 正字「'+esc(k)+'」</span></div>';
    if (tr) rows += '<div class="row"><label>简　体</label><span>'+esc(tr)+'</span></div>';
    if (sr) rows += '<div class="row"><label>繁　体</label><span>'+esc(sr)+'</span></div>';
    var rs = (d.rs || '').split('.');
    if (rs[0]) rows += '<div class="row"><label>部　首</label><span>'+esc(radName(parseInt(rs[0],10)))+' 部 · 部外 '+(parseInt(rs[1],10)||0)+' 画</span></div>';
    if (d.st) rows += '<div class="row"><label>总笔画</label><span>'+esc(d.st)+'</span></div>';
    if (d.py) rows += '<div class="row"><label>读　音</label><span>'+esc(d.py)+'</span></div>';
    if (d.fq) rows += '<div class="row"><label>反　切</label><span>'+esc(d.fq)+'</span></div>';

    var sw = '';
    initKX();
    if (!d.df && KX && KX[k]){
      var kxTxt = KX[k];
      var kxLong = kxTxt.length > 120;
      sw = '<div class="shuowen kx"><span class="lb">康 熙 字 典</span>'
        + '<div class="txt' + (kxLong ? ' clip' : '') + '">' + esc(kxTxt) + '</div>'
        + (kxLong ? '<button class="more">展开全文 ▾</button>' : '') + '</div>';
    } else if (!d.df && !KX){
      sw = '<div class="shuowen kx"><span class="lb">释 义</span><span style="color:var(--dim);font-size:12px">载入中…</span></div>';
    } else if (!d.df){
      sw = '<div class="shuowen kx"><span class="lb">释 义</span><span style="color:var(--dim);font-size:12px">《说文》《康熙》均未收此字</span></div>';
    }
    if (d.df){
      var swLong = d.df.length > 120;
      sw += '<div class="shuowen"><span class="lb">說 文 解 字</span>'
        + '<div class="txt' + (swLong ? ' clip' : '') + '">' + esc(d.df) + '</div>'
        + (swLong ? '<button class="more">展开全文 \u25BE</button>' : '');
      if (d.zw){
        buildIndexMap();
        var zwParts = Array.from(d.zw).map(function(x){
          var gi = CH2IDX && CH2IDX[x];
          var wide = x.codePointAt(0) > 0xFFFF;   /* 扩展区字符多数设备缺字，直接用位图 */
          if (gi != null && GB && (wide || !drawable(x))){
            var u = glyphURL(gi);
            if (u) return '<img class="zwi" src="'+u+'" data-ch="'+esc(x)+'" title="'+esc(x)+'">';
          }
          if (!wide && drawable(x)) return '<span data-ch="'+esc(x)+'">'+esc(x)+'</span>';
          return '<i class="zwna" title="该字形未收入常用字库">?</i>';
        }).join('');
        sw += '<div class="zw">重文<em class="zwlb">《说文》所录异体</em>'+zwParts+'</div>';
      }
      sw += '</div>';
    }

    var bel = BELONG[k] ? '<div class="rel"><div class="sect"><h3>它也是这些字的分身</h3><span class="ln"></span></div>'
      + BELONG[k].split('').map(function(x){return '<button class="chip" data-ch="'+esc(x)+'">'+esc(x)+'</button>'}).join('')
      + '</div>' : '';

    var lostHtml = lost.length ? '<details class="lost"><summary>另有 '+lost.length+' 个写法，为该字典专有码位，普通字库无法显示</summary><div class="body">'
      + lost.map(function(e){return '<i>'+esc(e[1])+'<br>'+esc((e[2]||'').replace(/-/g,'·'))+'</i>'}).join('')
      + '</div></details>' : '';



    card.innerHTML = '<div class="card">'
      + '<div class="fbar">' + [['','宋'],['f-kai','楷'],['f-xing','行'],['f-hei','黑']].map(function(f){
          return '<button class="fb'+(fntMode===f[0]?' on':'')+'" data-fnt="'+f[0]+'">'+f[1]+'</button>';
        }).join('') + '</div>'
      + '<div class="head"><div class="zi '+fntMode+'">'+esc(k)+'</div><div class="meta">'+rows
      + '<span class="badge">'+vs.length+' 个异体</span></div></div>'
      + sw
      + '<div class="sect"><h3>异 体 字 形</h3><span class="n">'+drawn.length+' 个写法可见</span><span class="ln"></span></div>'
      + (drawn.length ? '<div class="grid '+fntMode+'">'+drawn.join('')+'</div>' : '<div class="empty" style="padding:24px">此字的异体字形均未收入 Unicode 字库</div>')
      + lostHtml + bel
      + trail()
      + '</div>';

    if (drawn.length) hint.textContent = '点击任一异体字形，可继续查它的分身';
    else hint.textContent = '';
    return true;
  }

  var RAD = ('一丨丶丿乙亅二亠人儿入八冂冖冫几凵刀力勹匕匚匸十卜卩厂厶又口囗土士夂夊夕大女子宀寸小尢尸屮山巛工己巾干幺广廴廾弋弓彐彡彳心戈戶手支攴文斗斤方无日曰月木欠止歹殳毋比毛氏气水火爪父爻爿片牙牛犬玄玉瓜瓦甘生用田疋疒癶白皮皿目矛矢石示禸禾穴立竹米糸缶网羊羽老而耒耳聿肉臣自至臼舌舛舟艮色艸虍虫血行衣襾見角言谷豆豕豸貝赤走足身車辛辰辵邑酉釆里金長門阜隶隹雨青非面革韋韭音頁風飛食首香馬骨高髟鬥鬯鬲鬼魚鳥鹵鹿麥麻黃黍黑黹黽鼎鼓鼠鼻齊齒龍龜龠');
  function radName(n){ return RAD.charAt(n-1) || ''; }

  /* ---------- 交互 ---------- */
  function go(ch){
    ch = (ch||'').trim();
    if (!ch) return;
    var m = ch.match(/[\u3400-\u4DBF\u4E00-\u9FFF\u{20000}-\u{3FFFF}]/u);
    if (!m) return;
    var c = m[0];
    hidePanels();
    if (render(c)) {
      path.push(c);
      var pbx = document.getElementById('parts');
      if (pbx && !pbx.hidden && typeof window.__showDecomp === 'function') window.__showDecomp(c);
      if (path.length > 12) path.shift();
      try { history.replaceState(null, '', '#' + encodeURIComponent(c)); } catch(e){}
    }
    if (document.activeElement !== input) input.value = c;
  }

  card.addEventListener('click', function(e){
    var mo = e.target.closest('.shuowen .more');
    if (mo){
      var blk = mo.closest('.shuowen');
      var tx = blk.querySelector('.txt');
      var clipped = tx.classList.toggle('clip');
      mo.textContent = clipped ? '\u5c55\u5f00\u5168\u6587 \u25BE' : '\u6536\u8d77 \u25B4';
      return;
    }
    var fb = e.target.closest('[data-fnt]');
    if (fb){
      fntMode = fb.getAttribute('data-fnt');
      var g = card.querySelector('.grid');
      if (g) g.className = 'grid ' + fntMode;
      var zi = card.querySelector('.zi');
      if (zi) zi.className = 'zi ' + fntMode;
      card.querySelectorAll('.fnts .fb').forEach(function(b){
        b.classList.toggle('on', b.getAttribute('data-fnt') === fntMode);
      });
      return;
    }
    var t = e.target.closest('[data-ch]');
    if (t){ go(t.getAttribute('data-ch')); }
  });

  var lastQ = '';
  function pickChar(str){
    var chars = Array.from(str || '').filter(function(c){ return /[\u3400-\u4DBF\u4E00-\u9FFF\u{20000}-\u{3FFFF}]/u.test(c) });
    return chars;
  }
  function handle(){
    var v = input.value.trim();
    if (v === lastQ) return;
    lastQ = v;
    if (!v) return;
    var chars = pickChar(v);
    if (!chars.length) return;
    if (chars.length > 1){ renderText(v); return; }
    go(chars[0]);
  }
  function handleSoon(){ setTimeout(handle, 20); }
  input.addEventListener('input', handle);
  input.addEventListener('compositionend', handleSoon);
  input.addEventListener('change', handle);
  input.addEventListener('keyup', function(e){
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === 'Backspace' || (e.key && e.key.length === 1 && pickChar(input.value).length)) handle();
  });
  input.addEventListener('paste', handleSoon);
  document.addEventListener('focusout', function(){ if (input.value.trim()) handle(); });


  function renderText(str){
    var chars = Array.from(str).filter(function(c){ return /[\u3400-\u9FFF]/.test(c) });
    if (!chars.length) return;
    var seen = {}, items = '';
    chars.forEach(function(c, i){
      var k = resolve(c) || c, d = CH[k] || {};
      var n = (d.v||[]).length;
      items += '<div class="gl-item'+(n?' has':'')+'" data-ch="'+esc(c)+'"><span class="c">'+esc(c)+'</span>'
        + '<span class="n">'+(n?n+' 体':'—')+'</span></div>';
    });
    card.innerHTML = '<div class="card"><div class="sect"><h3>逐 字 查 验</h3><span class="n">'+chars.length+' 字</span><span class="ln"></span></div>'
      + '<div class="glyphs">'+items+'</div>'
      + '<div style="margin-top:16px;font-size:11.5px;color:var(--dim)">点任一字，展开它的分身</div></div>';
    hint.textContent = '已按碑文逐字拆开';
  }

  /* 主题 */
  document.querySelectorAll('.th').forEach(function(b){
    b.addEventListener('click', function(){
      MODE = b.dataset.k;
      document.querySelectorAll('.th').forEach(function(x){ x.classList.toggle('on', x === b) });
      var t = THEMES[MODE], st = document.documentElement.style;
      for (var k in t) st.setProperty('--'+k, t[k]);
      if (path.length) { var last = path[path.length-1]; render(last); }
    });
  });

  /* 快捷 */
  var QUICK = '馬为靈壽龍國真禮無與處龜華亂殺鳥風雲書萬齊齒';
  $('#quick').innerHTML = Array.from(QUICK).map(function(c){
    return '<button data-ch="'+c+'">'+c+'</button>';
  }).join('');
  $('#quick').addEventListener('click', function(e){
    var t = e.target.closest('[data-ch]');
    if (t){ var c = t.getAttribute('data-ch'); input.value = c; lastQ = c; go(c); }
  });

  /* 随机 */
  $('#rnd').addEventListener('click', function(){
    var keys = Object.keys(CH).filter(function(k){ return (CH[k].v||[]).length >= 8 });
    var c = keys[Math.floor(Math.random()*keys.length)];
    input.value = c; go(c);
  });

  /* 存图 */
  $('#save').addEventListener('click', function(){
    if (!path.length){ hint.textContent = '先查一个字'; return; }
    exportPNG(path[path.length-1]);
  });

  var CFONT = '"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif';
  function exportPNG(ch){
    var k = resolve(ch) || ch, d = CH[k] || {}, vs = [];
    (d.v||[]).forEach(function(e){ if (drawable(e[0])) vs.push(e[0]) });
    vs = vs.slice(0, 24);
    var W = 900, cols = 6, cell = 120, headerH = 300;
    var rows = Math.max(1, Math.ceil(vs.length/cols));
    var H = headerH + rows*cell + 110;
    var t = THEMES[MODE];
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    x.fillStyle = t.bg; x.fillRect(0,0,W,H);
    x.fillStyle = t.card; x.fillRect(40,40,W-80,H-80);
    x.strokeStyle = t.line; x.strokeRect(40.5,40.5,W-81,H-81);
    x.fillStyle = t.ink; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '500 30px ' + CFONT;
    x.fillText('字 的 分 身', W/2, 96);
    x.font = '13px ' + CFONT;
    x.fillStyle = t.mut; x.fillText('历代异体 · 简繁 · 《说文》重文', W/2, 128);
    x.fillStyle = t.ink; x.font = '110px ' + CFONT;
    x.fillText(k, W/2, 224);
    x.fillStyle = t.dim; x.font = '11px sans-serif';
    x.fillText(vs.length + ' 个可显示异体', W/2, 276);
    x.textBaseline = 'middle';
    var startY = headerH + 40, gx = (W-80-(cols*cell))/2 + 40;
    vs.forEach(function(c,i){
      var r = Math.floor(i/cols), cc = i%cols;
      var px = gx + cc*cell + cell/2, py = startY + r*cell + cell/2 - 6;
      x.fillStyle = t.box;
      x.fillRect(px-cell/2+5, py-cell/2+5, cell-10, cell-10);
      x.strokeStyle = t.line; x.strokeRect(px-cell/2+5.5, py-cell/2+5.5, cell-11, cell-11);
      x.fillStyle = t.ink; x.font = '46px ' + CFONT;
      x.fillText(c, px, py);
    });
    x.fillStyle = t.dim; x.font = '10.5px sans-serif';
    x.fillText('《異體字字典》〈異體字表〉· 《说文解字》重文 · Unicode Unihan', W/2, H-66);
    var a = document.createElement('a');
    a.download = '字的分身_' + k + '.png';
    a.href = cv.toDataURL('image/png');
    a.click();
    hint.textContent = '已存为 PNG';
  }


  /* ---------- 索引 ---------- */
  var IDXMAP = null, CH2IDX = null;
  function buildIndexMap(){
    if (IDXMAP) return;
    IDXMAP = new Array(GN);
    CH2IDX = {};
    for (var ch in CH){
      var rec = CH[ch];
      if (rec.v && rec.v.length && rec.v[0].length > 4 && rec.v[0][4] != null) CH2IDX[ch] = rec.v[0][4];
      for (var i=0;i<rec.v.length;i++){
        var e = rec.v[i];
        if (e.length > 4 && e[4] != null){
          IDXMAP[e[4]] = [ch, e[1]];
          if (CH2IDX[e[0]] == null) CH2IDX[e[0]] = e[4];
        }
      }
    }
  }

  function hidePanels(except){
    var pb = document.getElementById('parts');
    if (pb && except !== 'parts') pb.hidden = true;
  }

  /* ---------- 康熙释义 ---------- */
  var KX = null, kxLoading = false;
  function initKX(){
    if (KX || kxLoading) return;
    if (DATA.KX && typeof DATA.KX === 'object'){ KX = DATA.KX; return; }
    if (!DATA.KX || !window.DecompressionStream) return;
    kxLoading = true;
    var s = atob(DATA.KX), u = new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) u[i] = s.charCodeAt(i);
    var ds = new DecompressionStream('gzip');
    new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer().then(function(buf){
      KX = JSON.parse(new TextDecoder().decode(buf));
      kxLoading = false;
      if (path.length) render(path[path.length-1]);
    }).catch(function(){ kxLoading = false; });
  }

  /* ---------- 部件点选查字 ---------- */
  var IDSD = null;
  function initIDS(cb){
    if (IDSD){ cb && cb(); return; }
    if (DATA.IDS && typeof DATA.IDS === 'object' && DATA.IDS.s){ IDSD = DATA.IDS; cb && cb(); return; }
    if (!DATA.IDS || !window.DecompressionStream){ cb && cb(); return; }
    var str = atob(DATA.IDS), u = new Uint8Array(str.length);
    for (var i=0;i<str.length;i++) u[i] = str.charCodeAt(i);
    var ds = new DecompressionStream('gzip');
    new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer().then(function(buf){
      IDSD = JSON.parse(new TextDecoder().decode(buf));
      if (IDSD && !IDSD.s) IDSD = { s: IDSD, i: {} };
      cb && cb();
    }).catch(function(){ IDSD = null; cb && cb(); });
  }

  function searchParts(q){
    if (!IDSD) return null;
    var raw = Array.from(q).filter(function(c){ return /[\u3400-\u4DBF\u4E00-\u9FFF\u{20000}-\u{3FFFF}]/u.test(c); });
    if (!raw.length) return { full: [], part: [] };
    var ps = [];
    raw.forEach(function(c){ if (ps.indexOf(c) < 0) ps.push(c); });
    var groups = ps.map(function(c){
      var g = [c];
      var add = function(x){ if (x && g.indexOf(x) < 0) g.push(x); };
      var a = S2T[c], b = (DATA.t2s || {})[c];
      if (a) Array.from(a).forEach(add);
      if (b) Array.from(b).forEach(add);
      return g;
    });
    var N = groups.length, maxComps = N + 5;
    var full = [], part = [];
    for (var ch in IDSD.s){
      var st = IDSD.s[ch], k = 0;
      for (var i=0;i<N;i++){
        for (var j=0;j<groups[i].length;j++){
          if (st.indexOf(groups[i][j]) >= 0){ k++; break; }
        }
      }
      if (k === N) full.push([ch, st.length, k, N]);
      else if (k === N - 1 && N > 1 && st.length <= maxComps) part.push([ch, st.length, k, N]);
    }
    full.sort(function(a,b){ return a[1] - b[1]; });
    part.sort(function(a,b){ return a[1] - b[1]; });
    return { full: full, part: part };
  }

  var RAD_ALL = '一丨丶丿乙亅二亠人儿入八冂冖冫几凵刀力勹匕匚匸十卜卩厂厶又口囗土士夂夊夕大女子宀寸小尢尸屮山巛工己巾干幺广廴廾弋弓彐彡彳心戈戶手支攴文斗斤方无日曰月木欠止歹殳毋比毛氏气水火爪父爻爿片牙牛犬玄玉瓜瓦甘生用田疋疒癶白皮皿目矛矢石示禸禾穴立竹米糸缶网羊羽老而耒耳聿肉臣自至臼舌舛舟艮色艸虍虫血行衣襾見角言谷豆豕豸貝赤走足身車辛辰辵邑酉釆里金長門阜隶隹雨青非面革韋韭音頁風飛食首香馬骨高髟鬥鬯鬲鬼魚鳥鹵鹿麥麻黃黍黑黹黽鼎鼓鼠鼻齊齒龍龜龠';
  var RAD_HOT = '一丨丶丿乙二亠人儿入八冂冖几刀力十卜厂又亻口囗土士夕大女子宀寸小尸山工巾广弓彐彡彳阝氵扌忄心戈手攴文斤方日曰月木欠止比毛水爪片牙牛犬艹灬玉瓜甘生用田疋白皮皿目矢石示禾穴立竹米糸网羊耳肉臣自至臼舌舟艮艸虍虫血行衣見角言谷豆貝赤走足身車辛辰里金長門隹雨青非面革音頁風食馬高鬼魚鳥鹿麻黃黑鼓鼻齊齒龍龜';

  var picked = [], padMode = 'hot';
  var padBox, padTitle, padToggle, pickedBox, pinEl, pstatEl, presEl;

  function makePad(str, box){
    box.innerHTML = Array.from(str).map(function(c){
      return '<button class="pb" data-p="'+esc(c)+'">'+esc(c)+'</button>';
    }).join('');
  }

  function refreshPicked(){
    if (!picked.length){
      pickedBox.innerHTML = '<span class="pempty">点下方部件开始组合 · 可多选</span>';
    } else {
      pickedBox.innerHTML = picked.map(function(c){
        return '<span class="pk-chip" data-rm="'+esc(c)+'">'+esc(c)+'<i>×</i></span>';
      }).join('');
    }
    if (padBox) padBox.querySelectorAll('.pb').forEach(function(b){
      b.classList.toggle('on', picked.indexOf(b.getAttribute('data-p')) >= 0);
    });
  }

  function cellOf(row, partial){
    var ch = row[0], k = row[2], n = row[3];
    var rec = CH[ch];
    var simp = (rec && rec.tr) || S2T[ch] || '';
    var badge = n > 1
      ? '<span class="pk' + (partial ? ' part' : '') + '">' + k + '/' + n + '</span>'
      : (rec ? '<span class="rp">' + rec.v.length + ' 异体</span>' : '');
    return '<div class="rg' + (partial ? ' loose' : '') + '" data-ch="'+esc(ch)+'">'
      + '<span class="rc" style="font-size:26px;line-height:1.1">'+esc(ch)+'</span>'
      + (simp && simp !== ch ? '<span class="rp">'+esc(simp)+'</span>' : '')
      + badge + '</div>';
  }

  function runSearch(){
    if (!picked.length){ pstatEl.textContent = ''; presEl.innerHTML = ''; return; }
    initIDS(function(){
      if (!IDSD){ pstatEl.textContent = '部件数据未能载入'; return; }
      var t0 = Date.now();
      var hits = searchParts(picked.join(''));
      var ms = Date.now() - t0;
      if (!hits){ pstatEl.textContent = '部件数据未就绪'; return; }
      if (!hits.full.length && !hits.part.length){
        pstatEl.textContent = '没有同时包含这些部件的字';
        presEl.innerHTML = '';
        return;
      }
      var out = '';
      var fList = hits.full.slice(0, 60);
      if (fList.length){
        out += '<div class="pgroup">全中 ' + hits.full.length + ' 字</div>';
        out += fList.map(function(r){ return cellOf(r, false); }).join('');
      }
      var pList = hits.part.slice(0, 24);
      if (pList.length){
        out += '<div class="pgroup part-h">缺一个部件 ' + hits.part.length + ' 字</div>';
        out += pList.map(function(r){ return cellOf(r, true); }).join('');
      }
      presEl.innerHTML = out;
      pstatEl.textContent = '全中 ' + hits.full.length + ' · 缺部件 ' + hits.part.length + ' · ' + ms + ' ms';
    });
  }

  function togglePart(c){
    var i = picked.indexOf(c);
    if (i >= 0) picked.splice(i, 1); else picked.push(c);
    refreshPicked();
    runSearch();
  }

  function setupParts(){
    if (!document.getElementById('parts-btn')) return;
    padBox = document.getElementById('pad');
    padTitle = document.getElementById('padTitle');
    padToggle = document.getElementById('padToggle');
    pickedBox = document.getElementById('picked');
    pinEl = document.getElementById('pin');
    pstatEl = document.getElementById('pstat');
    presEl = document.getElementById('pres');
    var partsBox = document.getElementById('parts');

    makePad(RAD_HOT, padBox);
    refreshPicked();

    document.getElementById('parts-btn').addEventListener('click', function(){
      var show = partsBox.hidden;
      hidePanels('parts');
      partsBox.hidden = !show;
      if (show){
        initIDS(function(){ showDecomp(path.length ? path[path.length-1] : ''); });
        showDecomp(path.length ? path[path.length-1] : '');
      }
    });

    padToggle.addEventListener('click', function(){
      padMode = (padMode === 'hot') ? 'all' : 'hot';
      makePad(padMode === 'hot' ? RAD_HOT : RAD_ALL, padBox);
      padTitle.textContent = padMode === 'hot' ? '常用部件' : '全部 214 部首';
      padToggle.textContent = padMode === 'hot' ? '全部 214 部首' : '只看常用';
      refreshPicked();
    });

    partsBox.addEventListener('click', function(e){
      var rm = e.target.closest('[data-rm]');
      if (rm){ togglePart(rm.getAttribute('data-rm')); return; }
      var dc = e.target.closest('.decomp [data-p]');
      if (dc){ togglePart(dc.getAttribute('data-p')); return; }
      var pb = e.target.closest('.pb');
      if (pb){ togglePart(pb.getAttribute('data-p')); return; }
    });

    document.getElementById('pclear').addEventListener('click', function(){
      picked = [];
      refreshPicked();
      runSearch();
    });

    function showDecomp(ch){
      var box = document.getElementById('decomp');
      if (!ch || ch.length !== 1){ box.hidden = true; box.innerHTML = ''; return; }
      if (!IDSD){
        box.hidden = false;
        box.innerHTML = '<span class="dlb">构形数据载入中…</span>';
        initIDS();
        var tries = 0;
        var timer = setInterval(function(){
          if (IDSD || ++tries > 25){
            clearInterval(timer);
            showDecomp(ch);
          }
        }, 200);
        return;
      }
      if (!IDSD.i || !IDSD.i[ch]){ box.hidden = true; box.innerHTML = ''; return; }
      var ids = IDSD.i[ch];
      var OPS = '⿰⿱⿲⿳⿴⿵⿶⿷⿸⿹⿺⿻〾';
      var tokens = Array.from(ids);
      var body = tokens.map(function(c){
        if (OPS.indexOf(c) >= 0) return '<span class="dop">'+c+'</span>';
        return '<span class="dc" data-p="'+esc(c)+'">'+esc(c)+'</span>';
      }).join('');
      box.innerHTML = '<span class="dlb">拆解</span><span class="dz">'+esc(ch)+'</span>'
        + '<span style="color:var(--dim);margin:0 4px">=</span>' + body
        + '<div style="font-size:10px;color:var(--dim);letter-spacing:.5px;margin-top:2px">点任一构件加入查询</div>';
      box.hidden = false;
    }

    pinEl.addEventListener('input', function(){
      var v = pinEl.value.trim();
      if (v.length === 1) showDecomp(v);
      else if (!v) document.getElementById('decomp').hidden = true;
    });

    pinEl.addEventListener('keydown', function(e){
      if (e.key !== 'Enter') return;
      e.preventDefault();
      Array.from(pinEl.value).forEach(function(c){
        if (/[\u3400-\u9FFF]/.test(c) && picked.indexOf(c) < 0) picked.push(c);
      });
      pinEl.value = '';
      refreshPicked();
      runSearch();
    });

    window.__showDecomp = showDecomp;

    presEl.addEventListener('click', function(e){
      var t = e.target.closest('[data-ch]');
      if (t && t.getAttribute('data-ch')) go(t.getAttribute('data-ch'));
    });
  }

  /* 启动 */
  initGlyphPack();
  setupParts();
  try {
    var h = decodeURIComponent(location.hash.slice(1));
    if (h){ input.value = h; go(h); }
  } catch(e){}
  }  /* end boot */

  function fatal(msg){
    var c = document.getElementById('card');
    if (c) c.innerHTML = '<div class="card"><div class="empty">' + msg + '</div></div>';
    var jc = document.getElementById('jscheck');
    if (jc) jc.parentNode.removeChild(jc);
  }

  function start(){
    if (!window.__DATA_B64){
      fatal('数据文件未加载<br><span style="font-size:11px">请确认 data.js 与本页在同一目录</span>');
      return;
    }
    if (!window.DecompressionStream){
      fatal('浏览器版本过低，无法解压数据<br><span style="font-size:11px">请升级 Chrome / Edge / Safari</span>');
      return;
    }
    try {
      var str = atob(window.__DATA_B64), u = new Uint8Array(str.length);
      for (var i=0;i<str.length;i++) u[i] = str.charCodeAt(i);
      var ds = new DecompressionStream('gzip');
      new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer().then(function(buf){
        boot(JSON.parse(new TextDecoder().decode(buf)));
      }).catch(function(e){
        fatal('数据解压失败：' + e.message);
      });
    } catch(e){
      fatal('数据读取失败：' + e.message);
    }
  }
  start();
})();
</script>
